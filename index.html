<div id="siMark">SI-assisted build (Claude) · NASA data</div>

<div id="menu"></div>
<div id="nogl" class="hidden"></div>

<script>
/* ==================== SIM START ==================== */
/* Mission rules. Plain logic, no 3D code: the renderer reads this state, the self-test runs it headless. */
const SIM = (function () {
  'use strict';
  const D = NASA_DATA;
  const DAYS = CONFIG.missionDays;
  const CREW_N = 4;

  // ---------- Life support (BVAD) ----------
  const O2_PER_CM = D.bvad.o2Consumed_kg_per_CM_day;
  const CO2_PER_CM = D.bvad.co2Produced_kg_per_CM_day;
  const FOOD_PER_CM = D.bvad.foodSolids_kg_per_CM_day;
  const WATER_PER_CM = D.bvad.waterDrinkAndFood_kg_per_CM_day + D.bvad.waterHygiene_kg_per_CM_day + D.bvad.waterFlush_kg_per_CM_day; // 3.4 kg
  const WATER_RECOVERY = D.bvad.urineWaterRecovery;
  const WATER_PER_KG_O2 = (2 * 18.015) / 31.998;              // 2 H2O → O2: 36.03 g water per 32.00 g O2 = 1.126
  const ELEC_IDEAL_KWH = (285.8 * 2 / 31.998) / 3.6;          // 285.8 kJ per mol H2O × 2 mol ÷ 32 g = 17.9 MJ/kg = 4.96 kWh/kg
  const ELEC_EFFICIENCY = 0.6;                                // simplified
  const ELEC_KWH_PER_KG = ELEC_IDEAL_KWH / ELEC_EFFICIENCY;   // ≈ 8.27 kWh per kg O2
  const SCRUB_KW = 0.5, RECYCLER_KW = 0.6, BASE_KW = 2.0;     // simplified loads
  const HOURS = 24;

  // ---------- Air quality ----------
  const PPM_PER_KG_CO2 = 0.55 / 500 * 1e6;                    // 1 kg CO2 ≈ 0.55 m³ of gas in a 500 m³ cabin (simplified) = 1,100 ppm
  const CO2_BASE = 2500, CO2_WATCH = 5000, CO2_DANGER = 10000, CO2_FAIL = 20000;

  // ---------- Greenhouse (BVAD potato) ----------
  const GH_AREA = 40;                                         // m² per bed (simplified)
  const GH_KW = GH_AREA * 0.15;                               // 150 W of grow lights per m² (simplified) = 6 kW
  const GH_FOOD = D.bvad.potato_edible_g_per_m2_day * GH_AREA / 1000;
  const GH_O2 = D.bvad.potato_o2_g_per_m2_day * GH_AREA / 1000;
  const GH_CO2 = D.bvad.potato_co2_g_per_m2_day * GH_AREA / 1000;
  const PLANT_WATER = D.bvad.potato_transpiration_kg_per_m2_day * GH_AREA * 0.05; // 5% of a day's transpired water is lost when watering by hand (simplified) = 8 kg
  const GROW_DAYS = 6;                                        // simplified: seedlings started on the trip
  const HYDRATION_LOSS = 0.25;                                // simplified: share of soil water used per day
  const WILT_DAYS = 2;                                        // dry days before a crop dies

  // ---------- Ice drill (BVAD Table 4-85) ----------
  const DRILL_KW = D.bvad.lunarIce_kW;                                                 // 6.7 kW
  const DRILL_WATER = D.bvad.lunarIceO2_t_per_year * 1000 / 365 * WATER_PER_KG_O2;     // water behind 1 t O2/yr ≈ 3.1 kg/day

  // ---------- Power ----------
  const SOLAR_KW = 10, BATTERY_KWH = 200, REACTOR_KW = 10;   // simplified
  const MARS_SUN = 1 / (1.524 * 1.524);                       // inverse-square law: 43% of Moon sunlight
  const MARS_DAYLIGHT = 0.5;
  const DUST_STORM = 0.3, DUST_BRUSHED = 0.5;                 // simplified: share of sunlight through a dusty sky
  const DUST_CHANCE = 0.1;                                    // simplified chance a storm rolls in (fallback: storms cut power)
  const LUNATION = 2 * D.fallback.moonDayNight_days;          // 29.5 days sunrise to sunrise
  const NIGHT_START = 9;                                      // first dark day of the mission
  const EARTH_CYCLE = 27.3;                                   // simplified libration cycle

  // ---------- Radiation ----------
  const SHIELD_GCR = 0.9, SHIELD_SEP = 0.6, MAX_SHIELD = 4;  // simplified: share passed per berm layer
  const SHELTER = 0.2, MARS_SEP = 0.2;                        // simplified
  const DOSE_LIMIT = 60;                                      // simplified game limit for a 20-day stay

  // ---------- Caps & people ----------
  const O2_CAP = 40, WATER_CAP = 300, FOOD_CAP = 120;
  const ISOLATION = { moon: 1.2, mars: 1.8 };                 // morale lost per day (simplified)
  const DIFF = {
    explorer: { name: 'Explorer', budget: 80, reserves: 1.3, incidents: 0.15, wear: 0.10, harm: 0.7, blurb: 'Gentle events, bigger reserves.' },
    pioneer:  { name: 'Pioneer',  budget: 60, reserves: 1.0, incidents: 0.25, wear: 0.12, harm: 1.0, blurb: 'The standard mission.' },
    survivor: { name: 'Survivor', budget: 45, reserves: 0.85, incidents: 0.35, wear: 0.14, harm: 1.25, blurb: 'Frequent trouble, tight budget.' }
  };
  const CREW = [
    { id: 'you',   name: 'Commander (you)', short: 'You',   role: 'Commander', resil: 1.0 },
    { id: 'mira',  name: 'Mira Okafor',     short: 'Mira',  role: 'Botanist',  resil: 0.95 },
    { id: 'rory',  name: 'Rory Finch',      short: 'Rory',  role: 'Engineer',  resil: 1.05 },
    { id: 'tomas', name: 'Tomas Vale',      short: 'Tomas', role: 'Power tech', resil: 1.0 }
  ];
  const PTS = { o2: 2, water: 0.3, food: 1, kwh: 0.02, msv: 1.5, budget: 0.5, morale: 0.5 };

  // ---------- helpers ----------
  function rand(s) { s.rng = (s.rng + 0x6D2B79F5) | 0; let t = s.rng; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const r1 = v => Math.round(v * 10) / 10;
  const clone = o => JSON.parse(JSON.stringify(o));

  function derive(opts) {
    const data = opts.data || D;
    const isMoon = opts.location !== 'mars';
    const site = isMoon ? (data.moonTrek.sites.find(x => x.id === opts.siteId) || data.moonTrek.sites[0]) : { id: 'gale', name: 'Gale Crater', illumination: 1, earthVisibility: 1 };
    const sc = data.donki.doseScale, t0 = Date.parse(data.donki.windowStart + 'T00:00:00Z');
    const idx = iso => Math.round((Date.parse(iso + 'T00:00:00Z') - t0) / 864e5);
    const b = data.bvad;
    return {
      isMoon, site, windowDays: data.donki.windowDays, windowStart: data.donki.windowStart,
      // Storm dose before shielding: stronger with >100 MeV particles, a little bigger when more instruments saw it.
      seps: data.donki.sepEpisodes.map(e => ({ date: e.date, idx: idx(e.date), lead: idx(e.date) - idx(e.warnedBy), trigger: e.trigger, strong: e.over100MeV,
        dose: (e.over100MeV ? sc.strong_mSv : sc.moderate_mSv) * (1 + sc.perInstrumentBonus * e.instruments) })),
      O2_NEED: CREW_N * b.o2Consumed_kg_per_CM_day,
      CO2_MADE: CREW_N * b.co2Produced_kg_per_CM_day,
      FOOD_NEED: CREW_N * b.foodSolids_kg_per_CM_day,
      WATER_USE: CREW_N * (b.waterDrinkAndFood_kg_per_CM_day + b.waterHygiene_kg_per_CM_day + b.waterFlush_kg_per_CM_day),
      // Moon: no air, no magnetic field; the Moon blocks half the sky → half RAD's deep-space cruise dose. Mars: RAD surface dose.
      GCR: isMoon ? data.rad.cruiseDoseEquivalent_mSv_per_day * 0.5 : data.rad.surfaceDoseEquivalent_mSv_per_day,
      SEP_FACTOR: isMoon ? 1 : MARS_SEP
    };
  }

  // Share of day d in sunlight (Moon). Dark spell = (1 − illumination) × 29.5 days, starting on NIGHT_START.
  function lit(s, d) {
    if (!s.C.isMoon) return 1;
    const litLen = s.C.site.illumination * LUNATION, phase0 = litLen - NIGHT_START + 1;
    let l = 0;
    for (let k = 0; k < 4; k++) { const p = ((d - 1 + phase0 + k / 4) % LUNATION + LUNATION) % LUNATION; if (p < litLen) l += 0.25; }
    return l;
  }
  // Earth above the horizon (Moon Trek visibility). Mars always reaches Earth through relay orbiters (with delay).
  function earthUp(s, d) { if (!s.C.isMoon) return true; return ((d - 1 + s.earthPhase) % EARTH_CYCLE) / EARTH_CYCLE < s.C.site.earthVisibility; }
  function wIdx(s, d) { return (s.swOffset + d - 1) % s.C.windowDays; }
  function sepOn(s, d) { if (d > DAYS) return null; const i = wIdx(s, d); return s.C.seps.find(e => e.idx === i) || null; }
  // A storm the crew can know about: DONKI saw the linked flare/CME 'lead' days before the particles.
  function knownStorm(s) {
    for (let d = s.day; d <= Math.min(DAYS, s.day + 3); d++) { const e = sepOn(s, d); if (e && d - s.day <= Math.max(e.lead, d === s.day + 1 ? 1 : 0)) return { day: d, ep: e }; }
    return null;
  }
  // Long lunar night with no reactor yet: batteries alone will not last.
  function longNight(s) { return s.C.isMoon && darkSpellLength(s) > 5 && !s.mods.reactor; }
  function darkSpellLength(s) { let n = 0; for (let d = NIGHT_START; d <= NIGHT_START + 30 && lit(s, d) < 0.5; d++) n++; return n; }

  // ---------- create ----------
  function create(opts) {
    const dif = DIFF[opts.difficulty] || DIFF.pioneer, C = derive(opts), R = dif.reserves;
    const s = {
      opts: { location: C.isMoon ? 'moon' : 'mars', siteId: C.site.id, difficulty: opts.difficulty || 'pioneer' },
      C, dif, rng: (opts.seed >>> 0) || 7, day: 1, over: false, won: false, endReason: '', score: 0,
      o2: 18 * R, co2: 0, water: 170 * R, food: 45 * R, battery: 320, budget: dif.budget, morale: 70, dose: 0,
      scrub: 0.85, filter: false, beds: [{ progress: 2, hydr: 0.7, wilt: 0, lost: false }],
      mods: { arrays: C.isMoon ? 2 : 6, batteries: 2, reactor: 0, shield: 0 },
      drill: false, nightLightsOff: false, dustDays: 0, brushing: false, dustTomorrow: false, leanDays: 0, showerDays: 0,
      crew: CREW.map(c => ({ id: c.id, health: 100 })),
      plan: {}, today: null, choice: null, recent: {}, sepToday: null,
      ship: { day: C.isMoon ? 10 : 12, delayed: false, food: 20, water: 40, o2: 8 }, orders: [], depot: 2,
      swOffset: opts.swOffset != null ? opts.swOffset : 0, earthPhase: 0,
      zero: {}, log: [], causes: [], credits: {}, report: [], briefing: [], track: !!opts.track,
      stats: { o2Breathed: 0, o2Made: 0, waterSplit: 0, waterRecovered: 0, ghFood: 0, ghO2: 0, ghKwh: 0, dose: 0, darkDays: 0, dustSols: 0, commDays: 0, storms: [], firstFail: null, shedKwh: 0, actions: 0 }
    };
    if (opts.swOffset == null) s.swOffset = Math.floor(rand(s) * C.windowDays);   // random start inside the DONKI window
    while (sepOn(s, 1)) s.swOffset = (s.swOffset + 1) % C.windowDays;            // no storm before the first evening choice
    s.earthPhase = Math.floor(rand(s) * EARTH_CYCLE);
    s.ship.delayed = rand(s) < 0.4;
    startDay(s);
    return s;
  }

  // ---------- one-day projection (pure) ----------
  function project(s) {
    const C = s.C, m = s.mods, t = s.today, d = s.day;
    const L = lit(s, d);
    const dust = s.dustDays > 0 ? (s.brushing ? DUST_BRUSHED : DUST_STORM) : 1;
    const solarKW = C.isMoon ? m.arrays * SOLAR_KW * L : m.arrays * SOLAR_KW * MARS_SUN * MARS_DAYLIGHT * dust;
    const gen = solarKW + m.reactor * REACTOR_KW;
    const lightsOn = !t.boost && !t.shelter && !(s.nightLightsOff && L < 0.5);
    const beds = s.beds.length;
    const airF = s.scrub * (t.boost ? 1.5 : 1);                  // reroute sends greenhouse power to the air system
    const made = airF * C.O2_NEED;                               // electrolysis output, kg O2
    const loads = {
      base: BASE_KW,
      air: SCRUB_KW * airF + made * ELEC_KWH_PER_KG / HOURS,
      water: RECYCLER_KW,
      greenhouse: lightsOn ? beds * GH_KW : 0,
      drill: s.drill ? DRILL_KW : 0
    };
    const load = Object.values(loads).reduce((a, b) => a + b, 0);
    const cap = m.batteries * BATTERY_KWH;
    let battery = s.battery + (gen - load) * HOURS;                 // daily energy balance
    const sup = { base: 1, air: 1, water: 1, greenhouse: 1, drill: 1 };
    let shed = 0;
    if (battery < 0) {                                              // not enough energy: least vital systems switch off first
      let deficit = -battery; battery = 0;
      for (const k of ['drill', 'greenhouse', 'water', 'air', 'base']) {
        const e = loads[k] * HOURS; if (deficit <= 0 || e <= 0) continue;
        const cut = Math.min(e, deficit); sup[k] = 1 - cut / e; deficit -= cut; shed += cut;
      }
    }
    const wasted = Math.max(0, battery - cap);
    battery = Math.min(battery, cap);
    // Water: crew use; recycler returns 85% (BVAD); showers cut hygiene water (BVAD 0.4 kg/CM-d).
    const use = C.WATER_USE - (s.showerDays > 0 ? CREW_N * D.bvad.waterHygiene_kg_per_CM_day : 0);
    const recovered = use * WATER_RECOVERY * sup.water;
    let water = s.water - use + recovered + DRILL_WATER * (s.drill ? sup.drill : 0);
    // Greenhouse: lit and watered beds grow; ripe beds give food + O2 and absorb CO2.
    const ghPower = lightsOn ? sup.greenhouse : 0;
    let ghFood = 0, ghO2 = 0, ghCO2 = 0;
    const bedsOut = s.beds.map(b => {
      const n = { progress: b.progress, hydr: b.hydr, wilt: b.wilt, lost: false };
      const wet = b.hydr > 0;
      if (b.progress >= GROW_DAYS && wet) { ghFood += GH_FOOD * ghPower; ghO2 += GH_O2 * ghPower; ghCO2 += GH_CO2 * ghPower; }
      if (wet && ghPower > 0) n.progress += ghPower;
      n.hydr = Math.max(0, b.hydr - HYDRATION_LOSS * (ghPower > 0 ? 1 : 0.5));
      if (!wet) { n.wilt = b.wilt + 1; if (n.wilt >= WILT_DAYS) { n.progress = 0; n.lost = true; } } else n.wilt = 0;
      return n;
    });
    let waterShort = 0;
    if (water < 0) { waterShort = -water / use; water = 0; }
    let o2Made = Math.min(made * sup.air, water / WATER_PER_KG_O2);
    water -= o2Made * WATER_PER_KG_O2;
    let o2 = s.o2 + o2Made + ghO2 - C.O2_NEED;
    let o2Short = 0;
    if (o2 < 0) { o2Short = -o2 / C.O2_NEED; o2 = 0; }
    o2 = Math.min(o2, O2_CAP);
    const co2 = Math.max(0, s.co2 + C.CO2_MADE - airF * sup.air * C.CO2_MADE - ghCO2);
    const ppm = CO2_BASE + co2 * PPM_PER_KG_CO2;
    const ration = t.lean ? 0.7 : 1;
    let food = s.food + ghFood - C.FOOD_NEED * ration;
    let foodShort = 0;
    if (food < 0) { foodShort = -food / (C.FOOD_NEED * ration); food = 0; }
    // Radiation: cosmic-ray background + today's DONKI storm, cut by berm layers and the storm shelter.
    const gcrRaw = C.GCR, gcr = gcrRaw * Math.pow(SHIELD_GCR, m.shield);
    let sepRaw = 0, sep = 0;
    if (s.sepToday) { sepRaw = s.sepToday.dose * C.SEP_FACTOR; sep = sepRaw * Math.pow(SHIELD_SEP, m.shield) * (t.shelter ? SHELTER : 1); }
    // Morale
    let dm = -ISOLATION[C.isMoon ? 'moon' : 'mars'];
    if (C.isMoon && earthUp(s, d)) dm += 0.5;
    if (s.beds.some(b => b.progress >= GROW_DAYS) && ghPower > 0) dm += 1;
    if (t.lean) dm -= 4;
    if (s.showerDays > 0) dm -= 2;
    if (t.shelter) dm -= 3;
    if (t.rest) dm += 8;
    if (t.science) dm -= 3;
    const morale = clamp(s.morale + dm + (t.moraleBonus || 0), 0, 100);
    // Health: unmet needs hurt everyone.
    let harm = o2Short * 40 + waterShort * 25 + foodShort * 12 + sep * 0.6 + (t.lean ? 0.5 : 0) + (morale < 20 ? 1 : 0);
    if (ppm > CO2_DANGER) harm += (ppm - CO2_DANGER) / 1000 * 3;
    harm *= s.dif.harm;
    const heal = (harm === 0 ? 2 : 0) + (t.rest ? 5 : 0);
    const crew = s.crew.map((c, i) => ({ id: c.id, health: clamp(c.health - harm * CREW[i].resil + heal, 0, 100) }));
    return { L, dust, solarKW, gen, loads, load, cap, battery, sup, shed, wasted, use, recovered, water, waterShort, beds: bedsOut,
      ghFood, ghO2, ghCO2, ghPower, o2Made, o2, o2Short, co2, ppm, food, foodShort, ration, gcrRaw, gcr, sepRaw, sep,
      dose: s.dose + gcr + sep, morale, dm, harm, crew };
  }

  // ---------- gauges ----------
  function gauges(s) {
    const C = s.C, p = project(s), cap = s.mods.batteries * BATTERY_KWH;
    const st = (v, low, bad, hi) => hi ? (v >= bad ? 'bad' : v >= low ? 'low' : 'ok') : (v <= bad ? 'bad' : v <= low ? 'low' : 'ok');
    const o2d = s.o2 / C.O2_NEED, wd = s.water / C.WATER_USE, fd = s.food / C.FOOD_NEED, ppm = CO2_BASE + s.co2 * PPM_PER_KG_CO2;
    return [
      { id: 'o2', name: 'Oxygen', val: r1(s.o2) + ' kg · ' + r1(o2d) + ' d', pct: s.o2 / O2_CAP, status: st(o2d, 3, 1.5) },
      { id: 'co2', name: 'CO₂', val: Math.round(ppm) + ' ppm', pct: ppm / CO2_FAIL, status: st(ppm, CO2_WATCH, CO2_DANGER, true), high: true },
      { id: 'water', name: 'Water', val: Math.round(s.water) + ' kg · ' + r1(wd) + ' d', pct: s.water / WATER_CAP, status: st(wd, 5, 2) },
      { id: 'food', name: 'Food', val: Math.round(s.food) + ' kg · ' + r1(fd) + ' d', pct: s.food / FOOD_CAP, status: st(fd, 5, 2) },
      { id: 'power', name: 'Power', val: Math.round(s.battery) + '/' + cap + ' kWh · ' + r1(p.gen) + ' kW', pct: cap ? s.battery / cap : 0, status: p.shed > 0 ? 'bad' : st(s.battery / cap, 0.35, 0.12) },
      { id: 'rad', name: 'Dose', val: r1(s.dose) + '/' + DOSE_LIMIT + ' mSv', pct: s.dose / DOSE_LIMIT, status: st(s.dose / DOSE_LIMIT, 0.5, 0.8, true), high: true },
      { id: 'morale', name: 'Morale', val: Math.round(s.morale) + '/100', pct: s.morale / 100, status: st(s.morale, 45, 25) }
    ];
  }
  // Station alarms for the 3D scene (red blinking lights).
  function alarms(s) {
    const g = Object.fromEntries(gauges(s).map(x => [x.id, x.status]));
    return {
      scrubber: g.o2 !== 'ok' || g.co2 !== 'ok' || s.scrub < 0.5,
      water: g.water !== 'ok',
      greenhouse: s.beds.some(b => b.hydr < 0.3 || b.wilt > 0),
      power: g.power !== 'ok',
      galley: g.food !== 'ok',
      shelter: !!s.sepToday || !!knownStorm(s)
    };
  }

  // ---------- player actions (each takes 3–5 s on screen, each costs something) ----------
  const ACTIONS = {
    repair: { name: 'Repair & run the scrubber', station: 'scrubber', secs: 4, data: 'BVAD',
      cost: s => '−4 budget · −' + r1(s.C.O2_NEED * WATER_PER_KG_O2) + ' kg water · −' + Math.round(s.C.O2_NEED * ELEC_KWH_PER_KG) + ' kWh',
      gain: s => 'Scrubber to 100% · +' + s.C.O2_NEED.toFixed(2) + ' kg O₂ now · clears CO₂',
      check: s => s.budget < 4 ? 'Not enough budget' : s.water < s.C.O2_NEED * WATER_PER_KG_O2 ? 'Not enough water' : s.battery < s.C.O2_NEED * ELEC_KWH_PER_KG ? 'Battery too low' : '',
      apply: s => { s.budget -= 4; s.water -= s.C.O2_NEED * WATER_PER_KG_O2; s.battery -= s.C.O2_NEED * ELEC_KWH_PER_KG; s.scrub = 1; s.o2 = Math.min(O2_CAP, s.o2 + s.C.O2_NEED); s.co2 = Math.max(0, s.co2 - s.C.CO2_MADE); s.stats.o2Made += s.C.O2_NEED; s.stats.waterSplit += s.C.O2_NEED * WATER_PER_KG_O2; return 'Scrubber repaired. An O₂ cycle split ' + r1(s.C.O2_NEED * WATER_PER_KG_O2) + ' kg of water into ' + s.C.O2_NEED.toFixed(2) + ' kg of O₂.'; } },
    water: { name: 'Water the plants', station: 'greenhouse', secs: 3, data: 'BVAD',
      cost: () => '−' + r1(PLANT_WATER) + ' kg water', gain: () => 'Soil wet again · plants keep growing',
      check: s => s.water < PLANT_WATER ? 'Not enough water' : '',
      apply: s => { s.water -= PLANT_WATER; s.beds.forEach(b => { b.hydr = 1; b.wilt = 0; }); return 'You watered the potato beds (−' + r1(PLANT_WATER) + ' kg water).'; } },
    reroute: { name: 'Reroute power to life support', station: 'power', secs: 3, data: 'BVAD',
      cost: s => 'Greenhouse lights off today (−' + s.beds.length * GH_KW + ' kW) · crops pause',
      gain: s => 'Air system at 150% today: +' + r1(s.scrub * s.C.O2_NEED * 0.5) + ' kg O₂, more CO₂ scrubbed',
      check: s => s.today.boost ? 'Already rerouted today' : '',
      apply: s => { s.today.boost = true; return 'Power rerouted from the greenhouse lights to the air system.'; } },
    shield: { name: 'Build a shield layer', station: 'berm', secs: 5, data: 'DONKI',
      cost: () => '−12 budget', gain: () => 'Storm particles ×' + SHIELD_SEP + ', cosmic rays ×' + SHIELD_GCR + ' (each layer)',
      check: s => s.mods.shield >= MAX_SHIELD ? 'Berm is complete' : s.budget < 12 ? 'Not enough budget' : '',
      apply: s => { s.budget -= 12; s.mods.shield++; return 'You bagged regolith: berm layer ' + s.mods.shield + ' of ' + MAX_SHIELD + '.'; } },
    ration: { name: 'Pack lean rations', station: 'galley', secs: 3, data: 'BVAD',
      cost: () => 'Morale −4 today · small health cost', gain: s => 'Food use −30% today (saves ' + r1(s.C.FOOD_NEED * 0.3) + ' kg)',
      check: s => s.today.lean ? 'Already on lean rations' : '',

  const dataOf = (d, s) => typeof d.data === 'function' ? d.data(s) : d.data;   // dataset tag can depend on location

    p.beds.forEach((b, i) => { if (b.lost) { notes.push([7, 'A potato bed dried out and died.', 'BVAD']); addCause(s, 'A dry potato bed died.', 'BVAD'); } else if (s.beds[i].progress < GROW_DAYS && b.progress >= GROW_DAYS) notes.push([7, 'First harvest! Each bed gives ' + r1(GH_FOOD) + ' kg food and ' + r1(GH_O2) + ' kg O₂ a day.', 'BVAD']); });

    Object.assign(s, { battery: p.battery, water: p.water, o2: p.o2, co2: p.co2, food: p.food, dose: p.dose, morale: p.morale, crew: p.crew });
    s.beds = p.beds.map(b => ({ progress: b.progress, hydr: b.hydr, wilt: b.wilt, lost: b.lost }));
    s.scrub = Math.max(0, s.scrub - s.dif.wear * (s.filter ? 0.5 : 1) * (s.dustDays > 0 ? 1.3 : 1));   // filters clog every day
    if (s.leanDays > 0) s.leanDays--;
    if (s.showerDays > 0) s.showerDays--;
    if (s.dustDays > 0) { s.dustDays--; if (!s.dustDays) s.brushing = false; }
    const zeroNow = { oxygen: p.o2Short > 0, water: p.waterShort > 0, food: p.foodShort > 0, power: p.shed > 0 && (p.sup.air < 1 || p.sup.water < 1), 'air quality': p.ppm >= CO2_FAIL, morale: p.morale <= 0 };
    for (const k in zeroNow) { s.zero[k] = zeroNow[k] ? (s.zero[k] || 0) + 1 : 0; if (zeroNow[k] && !st.firstFail) st.firstFail = { system: k, day: s.day }; }
    const top = notes.sort((a, b) => b[0] - a[0]).slice(0, 2);
    if (!top.length) top.push([0, 'A steady day. The crew breathed ' + C.O2_NEED.toFixed(2) + ' kg of O₂; the recycler returned ' + Math.round(p.recovered) + ' kg of water.', 'BVAD']);
    s.report = top.map(x => ({ text: x[1], data: x[2] }));
    top.forEach(x => addLog(s, x[1], x[2]));

  function finish(s, won, reason) {

  // ---------- log, causes, credit ----------
  function addLog(s, text, data) { s.log.push({ day: s.day, text, data: data || '' }); if (s.log.length > 200) s.log.shift(); }
  function addCause(s, text, data) { s.causes.push({ day: s.day, text, data: data || '' }); }

  function outlook(s0, days) {

  }

  // ---------- debrief ----------
  function debrief(s) {
    const C = s.C, st = s.stats, list = Object.values(s.credits).filter(c => Math.abs(c.pts) >= 1);
    const helped = list.filter(c => c.pts > 0).sort((a, b) => b.pts - a.pts).slice(0, 3);
    const hurt = list.filter(c => c.pts < 0).sort((a, b) => a.pts - b.pts).slice(0, 3);
    const f = [];
    f.push([5, 'Your crew breathed ' + Math.round(st.o2Breathed) + ' kg of oxygen: ' + O2_PER_CM + ' kg per person per day. Making O₂ split ' + Math.round(st.waterSplit) + ' kg of water.', 'BVAD']);
    f.push([4, 'The recycler gave back ' + Math.round(st.waterRecovered) + ' kg of water (' + Math.round(WATER_RECOVERY * 100) + '% recovery). That water did not need a rocket.', 'BVAD']);

    const c = batch(goodPolicy, m, { location: 'mars' }, 5), e = batch(goodPolicy, m, { location: 'mars', data: mut(d => { d.rad.surfaceDoseEquivalent_mSv_per_day *= 3; }) }, 5);
    ok('Curiosity RAD changes Mars dose', Math.abs(c.avgDose - e.avgDose) > 5, r1(c.avgDose) + ' vs ' + r1(e.avgDose) + ' mSv with RAD ×3');
    const f1 = batch(goodPolicy, m, { location: 'moon', siteId: 'ridge' }, 5), f2 = batch(goodPolicy, m, { location: 'moon', siteId: 'ridge', data: mut(d => { d.moonTrek.sites[0].illumination = 0.62; }) }, 5);
    const f3 = batch(randomPolicy, m, { location: 'moon', siteId: 'ridge' }, 5), f4 = batch(randomPolicy, m, { location: 'moon', siteId: 'ridge', data: mut(d => { d.moonTrek.sites[0].illumination = 0.62; }) }, 5);

    CREW, DIFF, ACTIONS, DAYS, GROW_DAYS, O2_CAP, WATER_CAP, MAX_SHIELD, DOSE_LIMIT, SOLAR_KW,
    K: { O2_PER_CM, CO2_PER_CM, FOOD_PER_CM, WATER_PER_CM, WATER_RECOVERY, WATER_PER_KG_O2, ELEC_KWH_PER_KG, GH_FOOD, GH_O2, GH_KW, PLANT_WATER, DRILL_KW, DRILL_WATER, MARS_SUN, SHIELD_GCR, SHIELD_SEP, LUNATION, PPM_PER_KG_CO2, GH_AREA, BATTERY_KWH, REACTOR_KW },

})();

// ---------- 4×4 matrices (column-major) ----------

// Everyone wears an orange suit (like NASA's real "pumpkin" launch suits) with twin air tanks and a dark helmet.
// A coloured armband and helmet stripe tell the crew apart.
const SUIT = [0.86, 0.38, 0.17], SUIT_DARK = [0.66, 0.27, 0.12], TANK = [0.88, 0.8, 0.22], HELMET = [0.2, 0.2, 0.22], VISOR = [0.06, 0.07, 0.09];
const LOOKS = {
  you:   { band: [0.93, 0.92, 0.88], name: 'YOU' },
  mira:  { band: [0.3, 0.72, 0.45], name: 'MIRA' },
  rory:  { band: [0.96, 0.76, 0.2], name: 'RORY' },
  tomas: { band: [0.28, 0.66, 0.78], name: 'TOMAS' }

// Draws an astronaut from boxes, a capsule and spheres, with walk / work / sit / rest animation.
function drawAstronaut(a, look) {
  const t = a.anim, pose = a.pose;
  let root = M4.mul(M4.T(a.x, a.y || 0, a.z), M4.RY(a.yaw));
  if (pose === 'rest') root = M4.chain(root, M4.T(0, 0.15, 0), M4.RZ(Math.PI / 2), M4.T(-0.3, -0.6, 0));
  const bob = pose === 'idle' ? Math.sin(t * 2.2) * 0.03 : pose === 'walk' ? Math.abs(Math.sin(t * 8)) * 0.05 : 0;
  const sit = pose === 'sit' ? -0.3 : 0;
  const R0 = M4.mul(root, M4.T(0, bob + sit, 0));
  const swing = pose === 'walk' ? Math.sin(t * 8) * 0.7 : 0;
  const armL = pose === 'work' ? -1.2 + Math.sin(t * 9) * 0.35 : pose === 'sit' ? -0.9 : -swing;
  const armR = pose === 'work' ? -1.3 - Math.sin(t * 9) * 0.35 : pose === 'sit' ? -0.7 + Math.sin(t * 3) * 0.15 : swing;
  const legs = pose === 'sit' ? [-1.4, -1.4] : [swing, -swing];
  const ow = 0.028, thin = { outline: false };
  // legs + boots (pivot at hip)
  [-0.14, 0.14].forEach((x, i) => {
    const L = M4.chain(R0, M4.T(x, 0.62 - sit, 0), M4.RX(legs[i]));
    part('box', M4.chain(L, M4.T(0, -0.27, 0), M4.S(0.22, 0.54, 0.26)), SUIT_DARK, { ow });
    part('box', M4.chain(L, M4.T(0, -0.57, 0.04), M4.S(0.24, 0.13, 0.33)), PAL.black, { ow });
  });
  // body, belt, harness straps (an X on the back) and twin yellow air tanks
  part('cap', M4.chain(R0, M4.T(0, 1.0, 0), M4.S(0.62, 0.36, 0.5)), SUIT, { ow });
  part('cyl', M4.chain(R0, M4.T(0, 0.74, 0), M4.S(0.6, 0.07, 0.5)), PAL.black, thin);
  [-0.13, 0.13].forEach(x => part('cyl', M4.chain(R0, M4.T(x, 1.1, -0.36), M4.S(0.22, 0.62, 0.22)), TANK, { ow }));
  [-0.62, 0.62].forEach(r => part('box', M4.chain(R0, M4.T(0, 1.08, -0.48), M4.RZ(r), M4.S(0.06, 0.74, 0.03)), PAL.black, thin));   // harness crosses over the tanks
  // arms (pivot at shoulder) with gloves; armband on the left arm
  [[-0.4, armL], [0.4, armR]].forEach(([x, rot], i) => {
    const A = M4.chain(R0, M4.T(x, 1.3, 0), M4.RX(rot));
    part('box', M4.chain(A, M4.T(0, -0.25, 0), M4.S(0.16, 0.52, 0.18)), SUIT, { ow });
    part('box', M4.chain(A, M4.T(0, -0.55, 0), M4.S(0.17, 0.12, 0.19)), PAL.black, thin);
    if (i === 0) part('cyl', M4.chain(A, M4.T(0, -0.12, 0), M4.S(0.2, 0.08, 0.2)), look.band, thin);
  });

// ---------- movement & collision ----------
const PLAYER_R = 0.35;
function collide(x, z, nx, nz) {
  // Hall walls with the airlock door; outside yard bounds.
  const inside = x < HALL.L;
  if (inside) {
    nz = Math.max(-4.45 + PLAYER_R, Math.min(4.45 - PLAYER_R, nz));
    nx = Math.max(-HALL.L + 0.4, nx);
    if (nx > HALL.L - 0.3 && Math.abs(nz) > DOOR.half - PLAYER_R) nx = HALL.L - 0.3;
  } else {
    nx = Math.min(46, nx); nz = Math.max(-24, Math.min(24, nz));
    if (nx < HALL.L + 0.3 && Math.abs(nz) > DOOR.half - PLAYER_R) nx = HALL.L + 0.3;
  }
  for (const [x0, x1, z0, z1] of SOLIDS.concat(SOLIDS_EXTRA)) {
    if (nx > x0 - PLAYER_R && nx < x1 + PLAYER_R && nz > z0 - PLAYER_R && nz < z1 + PLAYER_R) {
      const px = Math.min(nx - (x0 - PLAYER_R), (x1 + PLAYER_R) - nx), pz = Math.min(nz - (z0 - PLAYER_R), (z1 + PLAYER_R) - nz);
      if (px < pz) nx = nx - (x0 + x1) / 2 < 0 ? x0 - PLAYER_R : x1 + PLAYER_R; else nz = nz - (z0 + z1) / 2 < 0 ? z0 - PLAYER_R : z1 + PLAYER_R;
    }
  }
  return [nx, nz];
}
const SPEED = 3.4;
function movePlayer(dt, input) {
  const P = G.player, len = Math.hypot(input.x, input.y);
  if (G.act || len < 0.05) { P.pose = G.act ? 'work' : 'idle'; return; }
  const ix = input.x / Math.max(1, len), iy = input.y / Math.max(1, len), cy = G.cam.yaw;
  // camera-relative: forward = (−sin yaw, −cos yaw), right = (cos yaw, −sin yaw)
  const dx = (ix * Math.cos(cy) - iy * Math.sin(cy)) * SPEED * dt, dz = (-ix * Math.sin(cy) - iy * Math.cos(cy)) * SPEED * dt;
  [P.x, P.z] = collide(P.x, P.z, P.x + dx, P.z + dz);
  P.y = P.x > HALL.L ? groundY(P.x, P.z) : 0;
  P.yaw = Math.atan2(dx, dz); P.pose = 'walk'; P.anim += dt;
}

// ---------- crew AI ----------
function crewTarget(c, idx) {
  const s = G.s, health = s.crew[idx + 1].health;
  if (health < 35) return { x: BUNKS[idx][0], z: BUNKS[idx][2], y: BUNKS[idx][1], pose: 'rest', yaw: 0 };
  if (s.today.shelter && (G.phase === 'active' || G.phase === 'briefing' || G.phase === 'choice')) return { x: SHELTER_SPOTS[idx][0], z: SHELTER_SPOTS[idx][1], pose: 'idle', yaw: 0 };
  const f = G.phase === 'active' ? G.dayT / ACTIVE_SECONDS() : G.phase === 'briefing' ? 0 : 0.5;
  if (f > 0.42 && f < 0.58) return { x: SEATS[idx][0], z: SEATS[idx][1], pose: 'sit', yaw: idx === 2 ? -Math.PI / 2 : 0 };
  if (G.phase === 'choice' || G.phase === 'result') return { x: SEATS[idx][0], z: SEATS[idx][1], pose: 'sit', yaw: idx === 2 ? -Math.PI / 2 : 0 };
  const j = JOBS[c.id];
  return { x: j.at[0], z: j.at[1], pose: 'work', yaw: j.face };
}
function routeTo(c, t) {   // aisle path: go to the aisle, along it, through the door if needed, then to the spot
  const pts = [], aisle = 0.0, cross = (a, b) => (a < HALL.L) !== (b < HALL.L);
  pts.push([c.x, aisle]);
  if (cross(c.x, t.x)) { pts.push([HALL.L - 0.6, 0]); pts.push([HALL.L + 0.8, 0]); }
  pts.push([t.x, cross(c.x, t.x) || t.x > HALL.L ? 0 : aisle]); pts.push([t.x, t.z]);
  return pts;
}
function updateCrew(dt) {
  G.crew.forEach((c, i) => {
    const t = crewTarget(c, i);
    c.anim += dt; c.mood = G.s.morale; c.blink = (G.time + i) % 4 < 0.12;
    if (!c.goal || c.goal.x !== t.x || c.goal.z !== t.z) { c.goal = t; c.path = routeTo(c, t); }
    if (c.path.length) {
      const [px, pz] = c.path[0], dx = px - c.x, dz = pz - c.z, d = Math.hypot(dx, dz);
      if (d < 0.08) c.path.shift();
      else { const st = Math.min(d, 2.6 * dt); c.x += dx / d * st; c.z += dz / d * st; c.yaw = Math.atan2(dx, dz); c.pose = 'walk'; c.y = c.x > HALL.L ? groundY(c.x, c.z) : 0; }
    } else { c.pose = t.pose; c.yaw = t.yaw; c.y = c.x > HALL.L ? groundY(c.x, c.z) : (t.y || 0); }
    c.helmet = c.x > HALL.L;
  });
}

// ---------- stations & interaction ----------
function nearStation() {
  const P = G.player; let best = null, bd = 1.6;
  for (const st of STATIONS) { const d = Math.hypot(P.x - st.at[0], P.z - st.at[1]); if (d < bd) { bd = d; best = st; } }
  return best;
}
function tryAct() {
  if (G.phase !== 'active' && G.phase !== 'briefing') return;
  const st = nearStation(); if (!st || !st.act || G.act) return;
  const why = SIM.canAct(G.s, st.act);
  if (why) { flashPrompt(why); return; }
  if (G.phase === 'briefing') setPhase('active');
  G.act = { id: st.act, t: 0, dur: SIM.ACTIONS[st.act].secs, st };
  const P = G.player; P.yaw = Math.atan2(st.sign[0] - P.x, st.sign[2] - P.z);
}
function finishAct() {
  const before = { o2: G.s.o2 };
  const msg = SIM.act(G.s, G.act.id);
  if (msg) {
    if (G.act.id === 'repair') say('rory', 'Tank is filling!');
    if (G.act.id === 'water') say('mira', 'Thank you! They were thirsty.');
    if (G.act.id === 'shield') say('tomas', 'One more layer. Nice!');
    if (G.demo) G.demo.onAct(G.act.id, before);
    if (G.tut >= 0) tutOnAct(G.act.id);
  }
  G.act = null;
  renderHUD();
}

/* ---------- transitions: boot screen, mission loading, day fade, typewriter ---------- */
// Terminal boot sequence: lines appear one by one, then the screen switches off like an old CRT. Any key or click skips it.
function playBoot(title, lines, done) {
  const el = $('boot');
  el.className = '';
  el.innerHTML = '<div class="boot-in"><div class="boot-logo">' + title + '</div><div class="boot-lines"></div><div class="boot-bar"><i></i></div><div class="boot-skip">press any key to skip</div></div>';
  const box = el.querySelector('.boot-lines'), bar = el.querySelector('.boot-bar i');
  let i = 0, finished = false;
  const finish = () => {
    if (finished) return; finished = true;
    clearInterval(timer); removeEventListener('keydown', skip, true); el.removeEventListener('pointerdown', skip);
    el.classList.add('out'); setTimeout(() => { el.className = 'hidden'; el.innerHTML = ''; }, 520);
    if (done) done();
  };
  const skip = e => { e.stopPropagation(); e.preventDefault(); finish(); };
  const timer = setInterval(() => {
    if (i < lines.length) { box.insertAdjacentHTML('beforeend', '<div><span>' + esc(lines[i][0]) + '</span><i></i><b>' + esc(lines[i][1]) + '</b></div>'); i++; bar.style.width = Math.round(i / lines.length * 100) + '%'; }
    else finish();
  }, 230);
  addEventListener('keydown', skip, true); el.addEventListener('pointerdown', skip);
}

function typeIn(root) {

function addDemoLog(before) { const s = G.s; s.log.push({ day: s.day, text: 'Result: O₂ tank ' + r1(before.o2) + ' → ' + r1(s.o2) + ' kg. Scrubber back to 100%.', data: 'BVAD' }); renderHUD(); }

if (selfTestOnly) {

  $('menu').innerHTML = '<div class="modal wide"><h2>Self-test (?selftest)</h2>' + testHTML(r) + '<p><a href="?">Back to the game</a></p></div>';
} else if (initGL()) {

  requestAnimationFrame(frame);
  const tutLoop = () => { if (G.tut >= 0 && G.s) tutTick(); setTimeout(tutLoop, 150); }; tutLoop();
